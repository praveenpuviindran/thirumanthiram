appId: com.praveenpuviindran.thirumanthiram
name: B N3 all tantras
---
- runFlow: _launch.yaml
- tapOn: "Tantras, tab.*"
- extendedWaitUntil:
    visible: "Paayiram & Nine Tantras"
    timeout: 20000

# Each TantraCard is one merged node; "Verses a–b" (EN DASH) is unique per card.
- scrollUntilVisible:
    element: "(?s).*Verses 0–112.*"
    direction: DOWN
    timeout: 30000
- tapOn: "(?s).*Verses 0–112.*"
- extendedWaitUntil:
    visible: "113 verses in this tantra"
    timeout: 20000
- assertVisible: "Paayiram"
- tapOn: "‹ Back"
- extendedWaitUntil:
    visible: "Paayiram & Nine Tantras"
    timeout: 20000

